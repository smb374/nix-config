unbind C-b
unbind -n C-Left
unbind -n C-Right
unbind '"'
unbind %

set -g  prefix               C-a
set -g  default-shell        "$SHELL"
set -g  default-terminal     "tmux-256color"
set -ga terminal-overrides   ",*256col*:Tc"
set -g  base-index           1
set -g  allow-passthrough    on
set -g  extended-keys        on
set -g  extended-keys-format csi-u
set -g  renumber-windows     on
set -g  status-keys          vi
set -g  mode-keys            vi
set -g  mouse                off
set -g  focus-events         off
set -sg escape-time          10
set -g  history-limit        10000

bind -n -N "Send the prefix key through to the application" \
  C-a send-prefix

# keybindings
bind h select-pane  -L
bind j select-pane  -D
bind k select-pane  -U
bind l select-pane  -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file  ~/.config/tmux/tmux.conf

bind -n S-Left  previous-window
bind -n S-Right next-window

bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# @theme_* colors and base styles, generated by Nix from the Basix scheme.
source-file -q ~/.config/tmux/basix-colors.conf

set -g  status-style   "bg=#{@theme_background}"
set -g  status-justify "absolute-centre"

set -g  status-left ""
set -ga status-left "#[fg=#{@theme_primary}, none] TMUX (#S) "

set -g  status-right ""
set -ga status-right "#[bg=#{@theme_background},fg=#{@theme_cyan}, none] #(uptime -p | sed -E 's/, //;s/ hours?/h/;s/ minutes?/m/') "
set -ga status-right "#[bg=#{@theme_background},fg=#{@theme_outline_variant}, none]│"
set -ga status-right "#[bg=#{@theme_background},fg=#{@theme_blue}, none] %Y-%m-%d %H:%M "

set -wg aggressive-resize off
set -wg pane-base-index   1
set -wg automatic-rename  on

set -g  window-status-format         " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g  window-status-style          "bg=#{@theme_background},fg=#{@theme_outline}"
set -g  window-status-last-style     "bg=#{@theme_background},fg=#{@theme_primary}"
set -g  window-status-activity-style "bg=#{@theme_red},fg=#{@theme_background}"
set -g  window-status-bell-style     "bg=#{@theme_red},fg=#{@theme_background},bold"
set -gF window-status-separator      "#[bg=#{@theme_background},fg=#{@theme_outline_variant}, none]│"
set -g  window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g  window-status-current-style  "bg=#{@theme_primary},fg=#{@theme_background},bold"
