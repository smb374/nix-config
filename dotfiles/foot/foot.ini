# Colors, generated by Nix from the Basix scheme (users/poyehchen/home/theming.nix).
include=~/.config/foot/basix-colors.ini

font=Maple Mono NL NF CN:pixelsize=16
pad=10x10

[scrollback]
lines=10000

[cursor]
style=block

[colors-dark]
alpha=0.85
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
