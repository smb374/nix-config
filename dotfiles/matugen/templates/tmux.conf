# Generated by DMS/matugen from nix-config/dotfiles/matugen/templates/tmux.conf. Do not edit.
# .dark variants: terminals stay dark ("Terminals - Always use Dark Theme").

# Palette, named after the matugen/dank16 roles; tmux.conf refers to these.
set -g @dank_background      "{{colors.background.dark.hex}}"
set -g @dank_on_surface      "{{colors.on_surface.dark.hex}}"
set -g @dank_primary         "{{colors.primary.dark.hex}}"
set -g @dank_outline         "{{colors.outline.dark.hex}}"
set -g @dank_outline_variant "{{colors.outline_variant.dark.hex}}"
set -g @dank_red             "{{dank16.color1.dark.hex}}"
set -g @dank_blue            "{{dank16.color4.dark.hex}}"
set -g @dank_cyan            "{{dank16.color6.dark.hex}}"

set -g message-style               "bg={{colors.surface_container.dark.hex}},fg={{colors.on_surface.dark.hex}}"
set -g message-command-style       "bg={{colors.surface_container.dark.hex}},fg={{colors.on_surface.dark.hex}}"
set -g mode-style                  "bg={{colors.secondary_container.dark.hex}},fg={{colors.on_secondary_container.dark.hex}}"
set -g pane-border-style           "fg={{colors.outline_variant.dark.hex}}"
set -g pane-active-border-style    "fg={{colors.primary.dark.hex}}"
set -g display-panes-colour        "{{colors.outline.dark.hex}}"
set -g display-panes-active-colour "{{colors.primary.dark.hex}}"
set -g clock-mode-colour           "{{colors.primary.dark.hex}}"
